services:
  db:
    image: postgres:18-alpine
    container_name: cafe-review-db
    environment:
      POSTGRES_DB: ${DB_NAME:-cafe_review}
      POSTGRES_USER: ${DB_USER:-postgres}
      # Required. Set DB_PASSWORD in .env (see .env.example); compose reads .env automatically.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit
    container_name: cafe-review-mailpit
    ports:
      # Bound to localhost. SMTP for the API, web UI to read captured mail.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
