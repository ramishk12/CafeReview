services:
  db:
    image: postgres:18-alpine
    container_name: cafe-review-db
    environment:
      POSTGRES_DB: cafe_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
